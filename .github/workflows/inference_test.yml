name: Tile Detection Inference Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # 直接在这里安装核心库，避开系统依赖报错
          pip install ultralytics sahi opencv-python-headless numpy

      - name: Run Inference Pipeline
        run: |
          python delect_full.py
