name: Tile Detection Inference Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true # 解决 UnpicklingError 的核心

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install AI Libraries
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics sahi opencv-python-headless numpy

      - name: Run Inference
        run: |
          python scripts/detect_full.py