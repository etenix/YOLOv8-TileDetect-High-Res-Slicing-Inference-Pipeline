name: Tile Detection Inference Test

# 触发条件：推送到 main 分支或手动点击运行
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 环境变量：解决 Node.js 20 弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-detection-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码：启用 LFS
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. 配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 3. 安装 AI 依赖库
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics sahi opencv-python-headless numpy

      # 4. 运行检测脚本
      - name: Run Inference Script
        run: |
          python scripts/detect_full.py

      # 5. 上传检测结果图片
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-output-images
          path: |
            Result_Full.jpg
            scripts/Result_Full.jpg
            runs/
          retention-days: 5