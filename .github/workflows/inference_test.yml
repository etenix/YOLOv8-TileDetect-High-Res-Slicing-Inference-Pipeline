name: Tile Detection Inference Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install AI Libraries
        run: |
          python -m pip install --upgrade pip
          # 注意：这里使用的是 headless 版本，它不需要任何系统依赖！
          pip install ultralytics sahi opencv-python-headless numpy

      - name: Run Inference
        run: |
          python detect_full.py