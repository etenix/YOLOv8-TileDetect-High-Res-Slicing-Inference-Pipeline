name: Tile Detection Inference Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 关键步骤：安装视觉任务所需的系统库
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # 确保安装了 YOLOv8 核心库
          pip install -r requirements.txt

      - name: Run Inference Pipeline
        run: |
          # 假设主运行脚本为 predict.py，并指定测试图路径
          # 请根据实际脚本名修改
          python predict.py --source ./data/test_images --weights ./models/best.pt
          
      # 可选：将检测结果保存为 Artifact
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-results
          path: runs/  # 假设 YOLOv8 默认输出在 runs 目录
